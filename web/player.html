            i + 1,
            i === queueIndex,
            (function (idx) {
              return function () { playQueueIndex(idx, false); };
            })(i),
            null
          );
          queueList.appendChild(row);
        }
      }

      function checkAuthStatus() {
        apiRequest("GET", "/api/v1/auth/status", null, function (status, data) {
          if (status !== 200 || !data) {
            setText(accountStatusSpan, "检查失败 (" + status + ")");
            return;
          }
          if (data.state === "authenticated") {
            setText(accountStatusSpan, data.profile.nickname);
            qrContainer.style.display = "none";
            setSettingsVisible(false);
            if (!discoverLoaded) {
              loadDailyRecommendations(false);
            }
            if (!playlistsLoaded) {
              loadUserPlaylists(true);
              loadLikedSongIds();
            }
          } else if (data.state === "confirmed_logged_out") {
            setText(accountStatusSpan, "未登录，请扫码");
            setSettingsVisible(true);
          } else {
            setText(accountStatusSpan, "网络错误: " + (data.message || data.kind));
          }
        });
      }

      function pollQrOnce(unikey) {
        apiRequest("POST", "/api/v1/auth/qr/poll", { unikey: unikey }, function (status, data) {
          if (status !== 200 || !data) {
            setText(qrPollMsg, "Poll error (" + status + ")");
            return;
          }
          if (data.status === "waiting_for_scan") {
            setText(qrPollMsg, "请用网易云音乐扫码 (" + data.polls_remaining + ")");
            qrPollTimer = setTimeout(function () { pollQrOnce(unikey); }, 2000);
          } else if (data.status === "waiting_for_confirm") {
            setText(qrPollMsg, "已扫码，请在手机确认 (" + data.polls_remaining + ")");
            qrPollTimer = setTimeout(function () { pollQrOnce(unikey); }, 2000);
          } else if (data.status === "confirmed") {
            setText(qrPollMsg, "登录成功！");
            discoverLoaded = false;
            playlistsLoaded = false;
            checkAuthStatus();
          } else {
            setText(qrPollMsg, "扫码结束: " + (data.message || data.reason || data.status));
          }
        });
      }

      // Tabs per modern-web-guidance tabs rules + BB10 fallback
      var tabIds = ["discover", "playlists", "search", "queue"];
      function showTab(name) {
        for (var i = 0; i < tabIds.length; i++) {
          var id = tabIds[i];
          var selected = id === name;
          var tabEl = document.getElementById("tab-" + id);
          var panelEl = document.getElementById("panel-" + id);
          tabEl.setAttribute("aria-selected", selected ? "true" : "false");
          if (selected) {
            tabEl.setAttribute("focusgroupstart", "");
            panelEl.removeAttribute("hidden");
            panelEl.style.display = "block";
            panelEl.setAttribute("tabindex", "0");
          } else {
            tabEl.removeAttribute("focusgroupstart");
            panelEl.setAttribute("hidden", "");
            panelEl.style.display = "none";
            panelEl.removeAttribute("tabindex");
          }
        }
        if (name === "playlists" && !playlistsLoaded && trimStr(tokenInput.value)) {
          loadUserPlaylists(true);
        }
      }

      for (var ti = 0; ti < tabIds.length; ti++) {
        (function (tabName, tabIndex) {
          var btn = document.getElementById("tab-" + tabName);
          btn.onclick = function () { showTab(tabName); };
          btn.onkeydown = function (e) {
            var ev = e || window.event;
            if (!ev) return;
            var code = ev.keyCode;
            var nextIdx = -1;
            if (code === 39) nextIdx = (tabIndex + 1) % tabIds.length;
            else if (code === 37) nextIdx = (tabIndex - 1 + tabIds.length) % tabIds.length;
            if (nextIdx !== -1) {
              var nextTab = document.getElementById("tab-" + tabIds[nextIdx]);
              showTab(tabIds[nextIdx]);
              nextTab.focus();
            }
          };
        })(tabIds[ti], ti);
      }

      document.getElementById("btn-top-search").onclick = function () {
        showTab("search");
        searchInput.focus();
      };
      document.getElementById("btn-open-queue").onclick = function () {
        showTab("queue");
      };

      document.getElementById("btn-daily-rec").onclick = function () {
        loadDailyRecommendations(discoverSongs.length > 0 && discoverTitle.firstChild && discoverTitle.firstChild.nodeValue.indexOf("每日") === 0 ? false : true);
      };
      document.getElementById("btn-personal-fm").onclick = function () {
        loadPersonalFm(true);
      };
      document.getElementById("btn-heart-mode").onclick = loadHeartMode;
      document.getElementById("btn-pl-heart").onclick = loadHeartMode;

      document.getElementById("btn-discover-play-all").onclick = function () {
        replaceQueueAndPlay(discoverSongs, 0, discoverContextLabel);
      };
      document.getElementById("btn-discover-queue").onclick = function () {
        for (var i = 0; i < discoverSongs.length; i++) {
          queue.push(discoverSongs[i]);
        }
        renderQueue();
        log("Queued " + discoverSongs.length + " track(s)");
      };

      function doConnect() {
        var cid = trimStr(clientIdInput.value) || ("client-" + Math.floor(Math.random() * 10000));
        clientIdInput.value = cid;
        setText(headerClientId, cid);
        try {
          window.localStorage.setItem(STORAGE_TOKEN, trimStr(tokenInput.value));
          window.localStorage.setItem(STORAGE_CLIENT_ID, cid);
        } catch (e) {}
        log("Connected as " + cid);
        discoverLoaded = false;
        playlistsLoaded = false;
        checkAuthStatus();
        syncInitialPlaybackState();
        startEventLongPoll();
      }

      document.getElementById("btn-save-token").onclick = doConnect;
      tokenInput.onkeydown = function (e) {
        var ev = e || window.event;
        if (ev && ev.keyCode === 13) doConnect();
      };
      document.getElementById("btn-check-auth").onclick = checkAuthStatus;

      document.getElementById("btn-qr-start").onclick = function () {
        if (qrPollTimer) { clearTimeout(qrPollTimer); qrPollTimer = null; }
        apiRequest("POST", "/api/v1/auth/qr/start", {}, function (status, data) {
          if (status !== 200 || !data) {
            log("Failed to start QR login (" + status + ")");
            return;
          }
          qrContainer.style.display = "block";
          qrSvgWrap.innerHTML = data.qr_svg;
          setText(qrPollMsg, "等待扫码...");
          qrPollTimer = setTimeout(function () { pollQrOnce(data.unikey); }, 2000);
        });
      };

      function doSearch() {
        var q = trimStr(searchInput.value);
        if (!q) return;
        setText(searchSummary, "搜索中...");
        apiRequest("GET", "/api/v1/search?q=" + encodeURIComponent(q) + "&limit=30", null, function (status, data) {
          if (status !== 200 || !data || !data.tracks) {
            setText(searchSummary, "搜索失败 (" + status + ")");
            return;
          }
          log("Search '" + q + "' returned " + data.tracks.length + " track(s)");
          renderSearchResults(data.tracks);
        });
      }

      document.getElementById("btn-search").onclick = doSearch;
      searchInput.onkeydown = function (e) {
        var ev = e || window.event;
        if (ev && ev.keyCode === 13) doSearch();
      };

      document.getElementById("btn-load-playlists").onclick = function () {
        if (activePlaylistId !== null) {
          openPlaylist(activePlaylistId, activePlaylistName, true);
        } else {
          loadUserPlaylists(true);
        }
      };

      playlistSelect.onchange = function () {
        var val = parseInt(playlistSelect.value, 10);
        if (!val) return;
        var name = "";
        for (var i = 0; i < loadedPlaylists.length; i++) {
          if (loadedPlaylists[i].id === val) {
            name = loadedPlaylists[i].name;
            break;
          }
        }
        openPlaylist(val, name, false);
      };

      playlistFilter.onkeyup = applyPlaylistFilter;
      playlistFilter.onchange = applyPlaylistFilter;
      document.getElementById("btn-clear-filter").onclick = function () {
        playlistFilter.value = "";
        applyPlaylistFilter();
      };
      document.getElementById("btn-play-playlist").onclick = function () {
        replaceQueueAndPlay(filteredPlaylistSongs, 0, activePlaylistName || "歌单");
      };
      document.getElementById("btn-queue-page").onclick = function () {
        var start = playlistPage * PAGE_SIZE;
        var end = Math.min(start + PAGE_SIZE, filteredPlaylistSongs.length);
        for (var i = start; i < end; i++) {
          queue.push(filteredPlaylistSongs[i]);
        }
        renderQueue();
        log("Added " + (end - start) + " track(s) to queue");
      };

      function stepPlaylistPage(delta) {
        playlistPage += delta;
        renderPlaylistPage();
      }
      document.getElementById("btn-pl-prev-top").onclick = function () { stepPlaylistPage(-1); };
      document.getElementById("btn-pl-next-top").onclick = function () { stepPlaylistPage(1); };
      document.getElementById("btn-pl-prev-bot").onclick = function () {
        stepPlaylistPage(-1);
        window.scrollTo(0, 0);
      };
      document.getElementById("btn-pl-next-bot").onclick = function () {
        stepPlaylistPage(1);
        window.scrollTo(0, 0);
      };

      document.getElementById("btn-q-prev").onclick = function () { queuePage -= 1; renderQueue(); };
      document.getElementById("btn-q-next").onclick = function () { queuePage += 1; renderQueue(); };
      document.getElementById("btn-clear-queue").onclick = function () {
        queue = [];
        queueIndex = -1;
        queuePage = 0;
        renderQueue();
      };

      function togglePlayPause() {
        markManualInteraction();
        if (!isOwner || !player.src || player.src === "" || player.src === window.location.href) {
          if (queue.length > 0) {
            playQueueIndex(queueIndex >= 0 ? queueIndex : 0, false);
          } else if (discoverSongs.length > 0) {
            replaceQueueAndPlay(discoverSongs, 0, discoverContextLabel);
          } else if (filteredPlaylistSongs.length > 0) {
            replaceQueueAndPlay(filteredPlaylistSongs, 0, activePlaylistName || "歌单");
          }
          return;
        }
        if (player.paused) {
          // Resume remains server-confirmed to uphold M4 single-owner exclusivity.
          sendPlaybackCommand("resume", null);
        } else {
          // Pause immediately locally (0ms, unaffected by HTTP/1.1 queueing), then sync server.
          player.pause();
          updateOwnershipUi(true, currentGen, "PAUSED", "OWNER");
          updatePlayButtonVisual(false);
          sendPlaybackCommand("pause", null);
        }
      }

      function stepTrack(delta) {
        if (queue.length === 0) return;
        var targetIdx = (queueIndex + delta) % queue.length;
        if (targetIdx < 0) targetIdx += queue.length;
        playQueueIndex(targetIdx, false);
      }

      function handleSeekBarChange(barEl) {
        isSeeking = false;
        var rawPct = parseFloat(barEl.value) || 0;
        syncNpSeekVisual(rawPct);
        if (player.duration) {
          var target = (rawPct / 100) * player.duration;
          player.currentTime = target;
          if (seekBar) seekBar.value = barEl.value;
          if (npSeekBar) npSeekBar.value = barEl.value;
          if (isOwner) sendPlaybackCommand("seek", null, target);
        }
      }

      function heartCurrentTrack() {
        if (currentTrackObj && currentTrackObj.id) {
          toggleLikeSong(currentTrackObj.id);
        }
      }

      btnMiniHeart.onclick = heartCurrentTrack;
      if (btnNpHeart) btnNpHeart.onclick = heartCurrentTrack;

      btnPlayPause.onclick = togglePlayPause;
      if (btnNpPlayPause) btnNpPlayPause.onclick = togglePlayPause;
      if (btnSleepTimer) btnSleepTimer.onclick = cycleSleepTimer;

      document.getElementById("btn-stop").onclick = function () {
        if (isOwner) {
          sendPlaybackCommand("stop", null);
        } else {
          dropLocalMediaAndReset("STOPPED", currentGen);
        }
      };

      document.getElementById("btn-prev").onclick = function () { stepTrack(-1); };
      document.getElementById("btn-next").onclick = function () { stepTrack(1); };
      document.getElementById("btn-np-prev").onclick = function () { stepTrack(-1); };
      document.getElementById("btn-np-next").onclick = function () { stepTrack(1); };

      seekBar.onmousedown = function () { isSeeking = true; };
      seekBar.ontouchstart = function () { isSeeking = true; };
      seekBar.onblur = function () { isSeeking = false; };
      seekBar.onchange = function () { handleSeekBarChange(seekBar); };

      if (npSeekBar) {
        npSeekBar.onmousedown = function () { isSeeking = true; };
        npSeekBar.ontouchstart = function () { isSeeking = true; };
        npSeekBar.onblur = function () { isSeeking = false; };
        npSeekBar.oninput = function () {
          syncNpSeekVisual(parseFloat(npSeekBar.value) || 0);
        };
        npSeekBar.onchange = function () { handleSeekBarChange(npSeekBar); };
      }

      qualitySelect.onchange = function () {
        syncQualityUi();
      };

      if (btnNpQuality && npQualityGroup) {
        var supportsFocusGroup = typeof HTMLElement !== "undefined" && ("focusGroup" in HTMLElement.prototype);
        if (!supportsFocusGroup) {
          npQualityGroup.setAttribute("role", "menu");
        }
        btnNpQuality.onclick = function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          if (isQualityMenuOpen()) {
            closeQualityMenu(false);
          } else {
            openQualityMenu(false);
          }
        };
        btnNpQuality.onkeydown = function (e) {
          var ev = e || window.event;
          if (ev && ev.keyCode === 40) {
            if (ev.preventDefault) ev.preventDefault();
            openQualityMenu(true);
          }
        };

        var qItems = npQualityGroup.getElementsByTagName("button");
        for (var qi = 0; qi < qItems.length; qi++) {
          (function (itemBtn, itemIdx) {
            itemBtn.onclick = function (e) {
              if (e && e.stopPropagation) e.stopPropagation();
              var nextQ = itemBtn.getAttribute("data-quality") || "standard";
              qualitySelect.value = nextQ;
              syncQualityUi();
              closeQualityMenu(true);
              log("Audio quality set to " + nextQ);
            };
            if (!supportsFocusGroup) {
              itemBtn.onkeydown = function (e) {
                var ev = e || window.event;
                if (!ev) return;
                var code = ev.keyCode;
                if (code === 27) {
                  if (ev.stopPropagation) ev.stopPropagation();
                  closeQualityMenu(true);
                  return;
                }
                var targetIdx = -1;
                if (code === 40) targetIdx = (itemIdx + 1) % qItems.length;
                else if (code === 38) targetIdx = (itemIdx - 1 + qItems.length) % qItems.length;
                else if (code === 36) targetIdx = 0;
                else if (code === 35) targetIdx = qItems.length - 1;
                if (targetIdx !== -1) {
                  if (ev.preventDefault) ev.preventDefault();
                  if (qItems[targetIdx].focus) qItems[targetIdx].focus();
                }
              };
            }
          })(qItems[qi], qi);
        }

        if (document.addEventListener) {
          document.addEventListener("click", function (e) {
            if (!isQualityMenuOpen()) return;
            var t = e && e.target;
            if (t !== btnNpQuality && (!npQualityMenu.contains || !npQualityMenu.contains(t))) {
              closeQualityMenu(false);
            }
          }, false);
        }
      }

      chkAutoNext.onchange = syncAutoBtnUi;
      if (btnNpAuto) {
        btnNpAuto.onclick = function () {
          chkAutoNext.checked = !chkAutoNext.checked;
          syncAutoBtnUi();
        };
      }

      document.getElementById("btn-open-now-playing").onclick = openNowPlaying;
      if (btnNpClose) btnNpClose.onclick = closeNowPlaying;
      document.getElementById("btn-np-heart-mode").onclick = loadHeartMode;
      document.getElementById("btn-np-queue").onclick = function () {
        closeNowPlaying();
        showTab("queue");
      };

      if (npDialog && typeof npDialog.showModal !== "function" && document.addEventListener) {
        // Fallback Esc dismissal only when native <dialog>.showModal() is absent (e.g., BB10 WebKit).
        document.addEventListener("keydown", function (e) {
          var ev = e || window.event;
          if (ev && ev.keyCode === 27 && isNowPlayingOpen()) {
            closeNowPlaying();
          }
        }, false);
      }

      document.getElementById("btn-clear-log").onclick = function () { logBox.innerHTML = ""; };

      player.addEventListener("play", function () {
        updatePlayButtonVisual(true);
        if (isOwner) {
          updateOwnershipUi(true, currentGen, "PLAYING", "OWNER");
        }
      }, false);

      player.addEventListener("playing", function () {
        consecutiveAudioErrors = 0;
      }, false);

      player.addEventListener("pause", function () {
        updatePlayButtonVisual(false);
        if (isOwner) {
          updateOwnershipUi(true, currentGen, "PAUSED", "OWNER");
        }
      }, false);

      player.addEventListener("timeupdate", function () {
        if (!isSeeking && player.duration) {
          var pct = (player.currentTime / player.duration) * 100;
          seekBar.value = pct;
          if (npSeekBar) npSeekBar.value = pct;
          syncNpSeekVisual(pct);
        }
        var curStr = formatTime(player.currentTime);
        var durStr = formatTime(player.duration);
        setText(timeDisplay, curStr + " / " + durStr);
        if (npCurTime) setText(npCurTime, curStr);
        if (npDurTime) setText(npDurTime, durStr);
      }, false);

      player.addEventListener("ended", function () {
        if (chkAutoNext.checked && isOwner && queue.length > 0) {
          if ((new Date().getTime() - lastManualInteractionMs) >= UNATTENDED_AUTO_STOP_MS) {
            log("Unattended playback limit reached (3h); stopping automatically.");
            player.pause();
            sendPlaybackCommand("stop", null);
            return;
          }
          var next = (queueIndex + 1) % queue.length;
          log("Track ended; requesting Auto-Next for gen=" + currentGen);
          playQueueIndex(next, true);
        }
      }, false);

      player.addEventListener("error", function () {
        if (!isOwner || !player.getAttribute("src")) return;
        var code = player.error ? player.error.code : "unknown";
        if (chkAutoNext.checked && queue.length > 1 && consecutiveAudioErrors < 3) {
          consecutiveAudioErrors += 1;
          log("Audio error code=" + code + "; skipping to next track in 1.5s (" + consecutiveAudioErrors + "/3)");
          clearErrorSkipTimer();
          errorSkipTimer = setTimeout(function () {
            errorSkipTimer = null;
            if (isOwner && queue.length > 1) {
              var next = (queueIndex + 1) % queue.length;
              playQueueIndex(next, true);
            }
          }, 1500);
        } else {
          log("Audio error code=" + code + (consecutiveAudioErrors >= 3 ? " (auto-skip limit reached)" : ""));
        }
      }, false);

      function onForegroundSync() {
        if (!trimStr(tokenInput.value)) return;
        syncInitialPlaybackState();
        if (!eventPollActive) {
          startEventLongPoll();
        } else if (!activeEventXhr) {
          pollNextEvent();
        }
      }
      if (window.addEventListener) {
        window.addEventListener("focus", onForegroundSync, false);
      }
      if (document.addEventListener) {
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) onForegroundSync();
        }, false);
      }

      syncQualityUi();
      syncNpSeekVisual(0);
      syncAutoBtnUi();
      initIdentity();
      if (trimStr(tokenInput.value)) {
        checkAuthStatus();
        syncInitialPlaybackState();
        startEventLongPoll();
      }
      log("Player initialized for " + clientIdInput.value);
    })();
  </script>
</body>
</html>
