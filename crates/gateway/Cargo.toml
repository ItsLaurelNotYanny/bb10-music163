[package]
name = "gateway"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
description = "BB10 Music163 modular monolith gateway service and M1 CLI."

[dependencies]
anyhow.workspace = true
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
futures-lite = "2"
http = "1"
media-relay = { path = "../media-relay" }
netease-adapter = { path = "../netease-adapter" }
playback-session = { path = "../playback-session" }
provider-model = { path = "../provider-model" }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-pemfile = "2"
rustls-webpki = { version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml = "0.8"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util = "0.1"
rcgen = "0.13"
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tower = { version = "0.5", features = ["util"] }
