[package]
name = "media-relay"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Service-agnostic media relay client with destination policy enforcement, bounded streaming, cancellation, and metrics."

[dependencies]
bytes = "1"
futures-core = "0.3"
futures-lite = "2"
http = "1"
isahc = "2.0.2"
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
