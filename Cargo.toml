[workspace]
resolver = "2"
members = [
    "crates/provider-model",
    "crates/media-relay",
    "crates/playback-session",
    "crates/netease-adapter",
    "crates/gateway",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
